name: Unzip project

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unzip:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Find and unpack any ZIP
        run: |
          ZIP=$(find . -path ./.git -prune -o -type f -iname '*.zip' -print | head -n 1)
          if [ -z "$ZIP" ]; then
            echo "No ZIP found in repository."
            exit 1
          fi
          echo "Found archive: $ZIP"
          unzip -o "$ZIP" -d .
          rm "$ZIP"
          find . -mindepth 2 -type d -name .git -prune -exec rm -rf {} +

      - name: Commit unpacked files
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Unpack project archive" || echo "Nothing to commit"
          git push
